<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>도우인 소싱 多功能清洁膏</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap"><style>
:root{--bg:#f4f5f2;--card:#ffffff;--ink:#1c1f1d;--sub:#646a66;--line:#dfe2dd;--acc:#1f6f8b;--chip:#e6f0f3;--warn:#8a5a00;--warnb:#f8eed6;
--display:"Gowun Dodum","Apple SD Gothic Neo",sans-serif;--body:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141716;--card:#1d2120;--ink:#e8ebe9;--sub:#9aa29d;--line:#2f3532;--acc:#7cc4dc;--chip:#1c3038;--warn:#e7c46a;--warnb:#3a3016;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141716;--card:#1d2120;--ink:#e8ebe9;--sub:#9aa29d;--line:#2f3532;--acc:#7cc4dc;--chip:#1c3038;--warn:#e7c46a;--warnb:#3a3016;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body)}
.wrap{max-width:1100px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--sub);text-transform:uppercase}
h1{font-family:var(--display);font-size:clamp(26px,5vw,38px);margin:4px 0 2px;text-wrap:balance}
.ko{color:var(--sub);margin:0 0 16px;font-size:16px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.facts span{background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.facts b{color:var(--acc)}
.note{background:var(--warnb);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px;margin:12px 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.v{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.v:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.v .im{position:relative;aspect-ratio:3/4;max-width:100%;background:var(--line)}
.v img{width:100%;height:100%;object-fit:cover;display:block}
.v .lk{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;border-radius:6px;padding:1px 6px;font-variant-numeric:tabular-nums}
.v .pl{position:absolute;inset:auto 8px 8px auto;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;font-size:14px}
.v .tx{padding:0 10px 10px;font-size:12px;line-height:1.4;color:var(--sub);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.v .au{padding:0 10px;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-family:var(--display);font-size:22px;margin:40px 0 4px}
footer{margin-top:40px;color:var(--sub);font-size:12px}
#pl{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#pl.on{display:flex}#pl .box{width:min(400px,100%);height:min(84vh,740px);background:#000;border-radius:14px;overflow:hidden}
#pl iframe{width:100%;height:100%;border:0}
#pl .top{position:fixed;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;gap:12px;color:#fff;font-size:13px}
#pl .top a{color:#fff}#pl button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:8px;cursor:pointer;font-size:20px;padding:6px 12px}
#pl .nav{position:fixed;top:50%;transform:translateY(-50%)}
@media (prefers-reduced-motion:no-preference){.v{transition:transform .15s}.v:hover{transform:translateY(-2px)}}
</style><div class="wrap"><div class="eyebrow">도우인 소싱 · 청소</div><h1>多功能清洁膏</h1><p class="ko">여러 표면의 오염을 닦는 페이스트형 세정제</p><div class="facts"><span>사용 장면 영상 <b>0</b>개</span><span>크리에이터 <b>0</b>명</span><span>최근 90일 <b>0</b>개</span><span>좋아요 합 <b>0</b></span></div><div class="note">GPT가 영상 설명을 보고 이 제품을 실제로 쓰는 장면이라고 판정한 영상만 모았어요. 썸네일을 누르면 바로 재생돼요(←/→ 다음 영상).</div><div class="grid"></div><footer>2026-10-26 기준 · 도우인 모바일 검색으로 수집 · 영상은 레퍼런스용(광고에 그대로 쓰면 저작권 문제가 생길 수 있어요)</footer></div><div id="pl"><div class="top"><span id="pt"></span><span><a id="po" target="_blank" rel="noopener">도우인에서 열기</a> <button id="px" aria-label="닫기">✕</button></span></div><button class="nav" id="pv" style="left:12px" aria-label="이전">‹</button><div class="box"><iframe id="pf" allow="autoplay; fullscreen" allowfullscreen></iframe></div><button class="nav" id="pn" style="right:12px" aria-label="다음">›</button></div><script>
(()=>{const pl=document.getElementById('pl'),f=document.getElementById('pf');let list=[],i=0;
function show(){const a=list[i];f.src='https://open.douyin.com/player/video?vid='+a.dataset.vid+'&autoplay=1';
document.getElementById('po').href=a.href;document.getElementById('pt').textContent=(i+1)+' / '+list.length;}
document.addEventListener('click',e=>{const a=e.target.closest('a[data-vid]');if(!a||e.metaKey||e.ctrlKey)return;e.preventDefault();
list=[...a.closest('.grid').querySelectorAll('a[data-vid]')];i=list.indexOf(a);pl.classList.add('on');show();});
function close(){pl.classList.remove('on');f.src='about:blank';}
document.getElementById('px').onclick=close;pl.onclick=e=>{if(e.target===pl)close();};
document.getElementById('pv').onclick=()=>{i=(i-1+list.length)%list.length;show();};
document.getElementById('pn').onclick=()=>{i=(i+1)%list.length;show();};
document.addEventListener('keydown',e=>{if(!pl.classList.contains('on'))return;if(e.key==='Escape')close();
if(e.key==='ArrowLeft')document.getElementById('pv').click();if(e.key==='ArrowRight')document.getElementById('pn').click();});})();
</script></body></html>
